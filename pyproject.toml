[project]
name = "deep-memory-agent"
dynamic = ["version"]
description = "Factory for building LangChain deepagents equipped with episodic, semantic, and procedural memory."
readme = "README.md"
authors = [
    { name = "Francesco Giurlanda", email = "francesco.giurlanda@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["langchain", "deepagents", "agents", "memory", "episodic-memory", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "deepagents>=0.7.8,<1.0",
    "langchain>=1.3.15,<2.0",
    "langchain-core>=1.6,<2.0",
    "langgraph>=1.2,<2.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/giurlanda/deep-memory-agent"
Repository = "https://github.com/giurlanda/deep-memory-agent"
Documentation = "https://giurlanda.github.io/deep-memory-agent/"
Changelog = "https://github.com/giurlanda/deep-memory-agent/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/deep_memory_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_memory_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Any is the right type for **kwargs passed straight through
    "COM812",  # conflicts with the formatter
    "CPY001",  # this project does not use per-file copyright headers
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "INP001", "PLC0415", "PLR2004", "S101", "SLF001", "TC"]
"examples/*" = ["D", "INP001", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# The public surface is built out of keyword-only factory arguments; five is too
# tight a budget for a factory that has to accept model, backend, prompt and
# tool-shaping options at once.
max-args = 9
