site_name: deep-memory-agent
site_description: Factory for building LangChain deepagents equipped with episodic, semantic, and procedural memory.
site_url: https://giurlanda.github.io/deep-memory-agent/
repo_url: https://github.com/giurlanda/deep-memory-agent
repo_name: giurlanda/deep-memory-agent
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Memory layout: memory-layout.md
  - Benchmark: benchmark.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
